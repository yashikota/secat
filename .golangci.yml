version: "2"

linters:
  default: standard
  enable:
    - gocritic
    - misspell
    - revive
  settings:
    errcheck:
      # Writing diagnostics and closing read-only files have no useful recovery.
      exclude-functions:
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close

formatters:
  enable:
    - gofmt
